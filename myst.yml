version: 1
project:
  title: 'Factor de capacidad diario de plantas solares en Colombia'
  description: Proyecto de Machine Learning, Universidad del Norte. Base de generación real y clima de 16 plantas colombianas, modelos de regresión de referencia y un Ridge jerárquico con nivel adaptativo.
  authors:
    - name: Jesús David Arévalo Montilla
    - name: Enmanuel David Díaz Molinares
    - name: Alex David Terán Meza
  keywords:
    - energía solar
    - factor de capacidad
    - Ridge jerárquico
    - validación espacio-temporal
  license: CC-BY-NC-SA-4.0
  github: https://github.com/AlexT09/ModelSolar
  thumbnail: figuras/fig_fc_vs_radiacion.png
  bibliography:
    - libro/referencias.bib
  exclude:
    - data/**
    - paper/**
    - '*.tex'
    - '*.pdf'
  toc:
    - file: libro/index.md
      title: Inicio
    - file: notebooks/Clima_a_Generacion_Colombia.ipynb
      title: Datos de XM y Open-Meteo
    - file: notebooks/Modelo_Propuesto_Colombia.ipynb
      title: Modelos y modelo propuesto
    - file: libro/Resumen_final.md
      title: Resumen del proyecto
site:
  template: book-theme
  options:
    logo: libro/assets/logo.svg
    logo_dark: libro/assets/logo-oscuro.svg
    logo_text: Solar en Colombia
    logo_alt: Sol sobre un panel solar
    favicon: libro/assets/favicon.svg
    style: libro/assets/estilo.css
    hide_authors: true
  actions:
    - title: Código en GitHub
      url: https://github.com/AlexT09/ModelSolar
  parts:
    footer: libro/assets/pie.md
    primary_sidebar_footer: libro/assets/barra-lateral.md
