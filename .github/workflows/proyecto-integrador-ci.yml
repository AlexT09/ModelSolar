name: Proyecto Integrador CI

on:
  push:
    paths:
      - 'Proyecto Integrador Pipelines/**'
  pull_request:
    paths:
      - 'Proyecto Integrador Pipelines/**'

defaults:
  run:
    working-directory: Proyecto Integrador Pipelines

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r docker/requirements.txt
          pip install flake8 pytest httpx
      - name: Lint
        run: flake8 app/ --max-line-length=110
      - name: Tests
        run: pytest tests/
